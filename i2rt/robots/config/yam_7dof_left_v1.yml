# 7-DOF arm, left. Referenced by i2rt/robot_models/arm/yam_7dof_left/v1/README.md.
#
# ==============================================================================================
#  NOT CALIBRATED ON A LEFT ARM. Everything below except `gripper_attach_*` is carried over
#  from yam_7dof_right_v1.yml, which was measured on hardware. No left arm has been built or
#  run, so treat these as a starting point and re-measure before trusting any of them:
#
#    motor_list          --stage check   (read-only; refuses a chain that is not what it says)
#    directions          --stage mirror  (the only thing that compares model to physical motion)
#    gravity_comp_factor --stage sweep
#    coulomb_friction    --stage sweep
#
#  The left arm is the right one reflected about the world x-z plane, generated by
#  mirror_arm_model.py. It is the same hardware mounted on the opposite face, so the motors and
#  their gearing are genuinely shared; what a reflection cannot promise is that a physical build
#  has the same friction or the same unmodelled harness load.
# ==============================================================================================
#
#   id  joint    type     rating      12-bit step   peak gravity   margin
#    1  joint1   DM6248   +/-120 N.m   58.6 mN.m       14.7 N.m      8.2x
#    2  joint2   DM6248   +/-120 N.m   58.6 mN.m       14.4 N.m      8.3x
#    3  joint3   DM4340   +/- 28 N.m   13.7 mN.m        5.2 N.m      5.4x
#    4  joint4   DM4340   +/- 28 N.m   13.7 mN.m        5.3 N.m      5.3x
#    5  joint5   DM4340   +/- 28 N.m   13.7 mN.m        0.7 N.m     40.0x
#    6  joint6   DM4310   +/- 10 N.m    4.9 mN.m        0.7 N.m     14.3x
#    7  joint7   DM4310   +/- 10 N.m    4.9 mN.m        0.7 N.m     14.3x
#    8  gripper  DM4310   +/- 10 N.m   (not an arm joint; the spec's "7 arm + 1")
motor_list:
  - [0x01, "DM6248"]
  - [0x02, "DM6248"]
  - [0x03, "DM4340"]
  - [0x04, "DM4340"]
  - [0x05, "DM4340"]
  - [0x06, "DM4310"]
  - [0x07, "DM4310"]

# Same as the right arm, and not merely copied: a mirrored build's motors reverse their positive
# rotation exactly where the axes do, by the same pseudovector rule, so the model-to-motor relation
# crosses the reflection unchanged. Still confirm with `--stage mirror` on a real left arm.
directions: [-1, 1, 1, 1, 1, 1, 1]

# Position-hold gains for the repo's own MotorChainRobot path. Arm7OSC does NOT use these: it
# closes position in the host loop and sends kp=0 with a small kd. Scaled from yam_v1 by the
# inertia ratio; untuned on hardware.
kp: [80.0, 80.0, 80.0, 40.0, 10.0, 10.0, 10.0]
kd: [5.0, 5.0, 5.0, 3.0, 1.5, 1.5, 1.5]

# Reflection-invariant in the model -- mass and geometry mirror exactly, so the gravity torque a
# joint sees is the same magnitude. The factors below are the right arm's hand-tuned values, which
# also absorb unmodelled harness load, and that part does not cross the reflection.
gravity_comp_factor: [1.2, 1.0, 0.6, 0.62, 1.0, 0.5, 1.2]

# Motor-side kd held while floating.
grav_comp_kd: [0.1, 0.1, 0.1, 0.3, 0.05, 0.05, 0.05]

# Breakaway friction, N.m, from the right arm. Friction is a property of the build, not of the
# geometry, so this is the least transferable set here.
#
#     joint  ratio  axis              stiction
#       1    48:1   base yaw            1.91     largest here; rises 1.33 -> 2.21 with angle
#       2    48:1   shoulder pitch      1.37
#       3    40:1   upper-arm roll      1.18
#       4    40:1   elbow pitch         0.46
#       5    40:1   forearm roll        0.29
#       6    10:1   wrist pitch         0.04     lowest on the arm, so the first to hunt
#       7    10:1   wrist roll          0.10     not constant -- see below
#
# These drive `_cap_task_stiffness` and `_cap_host_damping` in arm7_bringup.py, so they set the
# usable task gain directly. Re-measure with `--stage sweep` after any mechanical change.
coulomb_friction: [1.91, 1.37, 1.18, 0.46, 0.29, 0.04, 0.10]

# Where the gripper module attaches, relative to this arm's terminal body. 
gripper_attach_pos: "-0.068901 0.0002939999997 0.025637"
gripper_attach_quat: "-0.49999999999930123 0.50000000000203615 -0.50000000000140798 0.49999999999725458"
