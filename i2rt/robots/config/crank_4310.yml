  # The 7-DOF arm's two sides are separate families, so each carries its own block. joint7 is a
  # wrist pitch rather than the tool roll, so the gripper bolts off that axis --
  # gripper_pos/gripper_quat carry that offset, which the mount pose cannot (moving it would
  # move joint7's axis line).
  yam_7dof_left:
    v1:
      pos: "4.47332e-06 -0.02565 -0.0380064"
      quat: "-7.3122876473820652e-14 -7.3123145069636984e-14 0.70710807985947355 0.70710548251123628"
      axis: "0 0 -1"
      gripper_pos: "-0.068901 -0.000294 0.025637"
      gripper_quat: "-0.70711 0 0.70711 0"
  yam_7dof_right:
    v1:
      pos: "4.47332e-06 0.02565 -0.0380064"
      quat: "-7.3122876473820652e-14 7.3123145069636984e-14 0.70710807985947355 -0.70710548251123628"
      axis: "0 0 1"
      gripper_pos: "-0.068901 0.000294 0.025637"
      gripper_quat: "0 0.70711 0 -0.70711"

# Gripper motor config
motor_type: "DM4310"
motor_kp: 20.0
motor_kd: 0.5

# Gripper limits — null triggers runtime auto-calibration (see motor_chain_robot.py)
gripper_limits: null
needs_calibration: true

# Force limiter config
limiter:
  clog_force_threshold: 0.5
  clog_speed_threshold: 0.2
  sign: 1.0
  force_torque_map: "crank"
  gripper_close_angle: 0.13962634    # 8/180*pi
  gripper_open_angle: 2.96705973     # 170/180*pi
  gripper_stroke: 0.071
  motor_reading_offset: 0.174
