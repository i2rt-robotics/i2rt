[build-system]
# Capped below 0.10 by the root project's build constraint.
requires = ["scikit-build-core>=0.9,<0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "i2rt-ecat"
version = "0.1.0"
description = "CAN frames over an EtherCAT-to-CAN board, driven by SOEM"
requires-python = ">=3.10"
license = { text = "MIT; bundled SOEM is GPL-2.0 with a linking exception (third_party/soem/LICENSE)" }
dependencies = ["numpy"]

[tool.scikit-build]
minimum-version = "0.9"
cmake.version = ">=3.15"
cmake.build-type = "Release"
wheel.packages = ["i2rt_ecat"]
# A plain shared library loaded through ctypes: no CPython ABI, so one wheel per platform.
wheel.py-api = "py3"
wheel.license-files = ["LICENSE", "third_party/soem/LICENSE"]

[tool.uv]
# uv rebuilds a local package only when one of these changes.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "CMakeLists.txt" },
  { file = "src/**" },
  { file = "i2rt_ecat/**" },
]
